[package]
name="rust-rocket-mysql-starter"
version="0.1.0"
edition="2021"

[dependencies]
rocket={version="0.5.1",features=["json"]}
serde={version="1",features=["derive"]}
serde_json="1"
dotenvy="0.15"
uuid={version="1",features=["v4","serde"]}
chrono={version="0.4",features=["serde"]}
sqlx={version="0.7",features=["runtime-tokio-rustls","mysql","macros","chrono","uuid","migrate"]}
anyhow="1"
thiserror="1"
tokio={version="1",features=["rt-multi-thread","macros"]}
rocket_cors="0.6"
